name: Create GitHub Release
run-name: Release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.0.1 or v1.1.0-beta.1'
        required: true
        type: string
      source_ref:
        description: 'Source commit, branch or tag; blank uses the selected workflow revision'
        required: false
        type: string
      draft:
        description: 'Leave the completed release as a draft'
        default: false
        type: boolean
      prerelease:
        description: 'Mark this as a prerelease'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release identity
        id: source
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Use a version tag such as v1.0.1 or v1.1.0-beta.1."
            exit 1
          fi
          git check-ref-format "refs/tags/$RELEASE_TAG"
          sha=$(git rev-parse HEAD)
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            if [[ "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" != "$sha" ]]; then
              echo "::error::The existing tag points to a different commit; it will not be moved."
              exit 1
            fi
          fi
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
      - name: Require successful Pages verification for this exact source
        id: qualification
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          run_url=$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/runs" \
            -f head_sha="$SOURCE_SHA" -f per_page=1 \
            --jq ".workflow_runs[] | select(.head_sha == \"$SOURCE_SHA\" and .status == \"completed\" and .conclusion == \"success\") | .html_url")
          if [[ -z "$run_url" ]]; then
            echo "::error::The latest Pages verification for $SOURCE_SHA has not succeeded. Complete its existing build/browser gates before releasing."
            exit 1
          fi
          printf 'url=%s\n' "$run_url" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Package the static site and checksums
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          QUALIFICATION_URL: ${{ steps.qualification.outputs.url }}
        shell: python
        run: |
          import hashlib
          import os
          import shutil
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          tag = os.environ["RELEASE_TAG"]
          source = os.environ["SOURCE_SHA"]
          repository = os.environ["GITHUB_REPOSITORY"]
          qualification = os.environ["QUALIFICATION_URL"]
          output = Path("release")
          output.mkdir()
          notes = (
              f"# BowserBOY ADVANCED {tag}\n\n"
              f"Source: https://github.com/{repository}/commit/{source}\n\n"
              f"Successful build/browser gate: {qualification}\n\n"
              "Extract the static ZIP and serve it over HTTP, not file://. "
              "Keep its directory layout intact.\n\n"
              "Internet access is required for the upstream EmulatorJS runtime. "
              "Only the original Pixel Lab demo is bundled; no commercial ROM "
              "collection or BIOS is included. Export saves before changing hosts, "
              "because progress belongs to the browser origin.\n\n"
              "Preserve THIRD_PARTY_NOTICES.md. Checksums detect changed bytes; "
              "they are not a digital signature.\n\n"
              "Engineering documentation: download the separate "
              "Building-a-Little-Escape.pdf companion asset. The second-edition "
              "book retains its own dated source and review boundaries; it "
              "is not included inside the application ZIP.\n"
          )
          Path("dist/RELEASE-NOTES.md").write_text(notes, encoding="utf-8")
          Path("dist/THIRD_PARTY_NOTICES.md").write_bytes(
              Path("THIRD_PARTY_NOTICES.md").read_bytes()
          )
          (output / "RELEASE-NOTES.md").write_text(notes, encoding="utf-8")
          archive = output / f"BowserBOYADVANCED-{tag}-static.zip"
          with ZipFile(archive, "w", compression=ZIP_DEFLATED) as bundle:
              for path in sorted(Path("dist").rglob("*")):
                  if path.is_file():
                      bundle.write(path, path.relative_to("dist").as_posix())
          book = Path("book/published/Building-a-Little-Escape.pdf")
          expected, filename = Path("book/published/SHA256SUMS.txt").read_text(
              encoding="utf-8"
          ).strip().split("  ")
          checksum = hashlib.sha256(book.read_bytes()).hexdigest()
          if filename != book.name or checksum != expected:
              raise SystemExit("The reviewed book does not match its published checksum.")
          if not book.read_bytes().startswith(b"%PDF-"):
              raise SystemExit("The book companion is not a PDF.")
          shutil.copyfile(book, output / book.name)
          (output / "SHA256SUMS.txt").write_text(
              f"{hashlib.sha256(archive.read_bytes()).hexdigest()}  {archive.name}\n"
              f"{checksum}  {book.name}\n", encoding="utf-8"
          )
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-package
          path: release
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-package
          path: release
      - name: Verify the release archive
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt
      - name: Create the release with its completed assets
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.package.outputs.source_sha }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          flags=(--draft)
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            "BowserBOYADVANCED-${RELEASE_TAG}-static.zip" \
            Building-a-Little-Escape.pdf SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
            --title "BowserBOY ADVANCED $RELEASE_TAG" \
            --notes-file RELEASE-NOTES.md "${flags[@]}"
      - name: Publish the completed release
        if: ${{ !inputs.draft }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
