<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>BowserBoyAdvance cartridge player</title>
    <style>
      html,body,#game{width:100%;height:100%;margin:0;background:#15101f;overflow:hidden;font-family:"Segoe UI",Arial,sans-serif}
      canvas{image-rendering:pixelated}
      .ejs_menu_bar,.ejs_context_menu,.ejs_virtualGamepad_parent,.ejs_virtualGamepad_open{display:none!important}
      .native-settings canvas{opacity:0}
      .native-settings .ejs_settings_parent{display:block;position:absolute!important;inset:0!important;transform:none!important;width:100%!important;height:100%!important;max-height:none!important;margin:0!important;padding:12px;box-sizing:border-box;overflow:auto!important;border-radius:12px!important;background:linear-gradient(145deg,#2b2039,#171220)!important;color:#eee2fa!important;font-family:"Segoe UI",Arial,sans-serif!important}
      .native-settings .ejs_settings_transition{width:100%!important;height:auto!important;max-height:none!important}
      .native-settings .ejs_setting_menu,.native-settings .ejs_settings_transition>div{max-height:none!important}
      .native-settings .ejs_settings_main_bar{cursor:pointer;min-height:44px!important;margin:5px 0!important;padding:12px!important;box-sizing:border-box;border:1px solid #b38bd230!important;border-radius:10px!important;background:#392a49!important;color:#e8d9f7!important;font-family:inherit!important;font-size:13px!important;line-height:1.5!important;transition:background .15s,box-shadow .15s}
      .native-settings .ejs_settings_main_bar:hover{background:#513967!important;box-shadow:0 0 18px #a365dd1a}
      .native-settings .ejs_settings_transition>div{background:transparent!important;color:inherit!important}
      .native-settings input,.native-settings select,.native-settings button{accent-color:#bd9cff;color:#eee2fa;background:#392a49;border-color:#9673b6;border-radius:8px;font:inherit;min-height:36px}
      .native-settings [role=button]:focus-visible,.native-settings button:focus-visible{outline:2px solid #d5b6ff;outline-offset:-2px}
    </style>
    <script type="module" src="./src/player.js"></script>
  </head>
  <body><div id="game"></div></body>
</html>
